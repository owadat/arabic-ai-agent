name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test command parser
        run: |
          mkdir -p /tmp/agent-tests
          javac -encoding UTF-8 -d /tmp/agent-tests AgentCore.java AgentCoreTest.java
          java -cp /tmp/agent-tests org.arabicagent.app.AgentCoreTest

      - name: Build APK
        run: |
          bash prepare.sh
          cd android-project
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Arabic-AI-Agent-APK
          path: android-project/build/outputs/apk/debug/*.apk
          if-no-files-found: error
